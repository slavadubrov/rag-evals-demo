[project]
name = "rag-evals"
version = "0.1.0"
description = "Companion demo to 'Evaluating RAG' — runnable harness for every metric in the article."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Viacheslav Dubrov", email = "slavadubrov@gmail.com" }]

dependencies = [
    "qdrant-client>=1.11",
    "fastembed>=0.4",
    "sentence-transformers>=3.0",
    "openai>=2.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "datasets>=2.20",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-tqdm",
]

[project.scripts]
rag-evals = "rag_evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

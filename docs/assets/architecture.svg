<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .lane-title { font-weight: 600; fill: #0f172a; font-size: 13px; }
      .box { fill: #fff; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .box-label { fill: #0f172a; }
      .box-sub { fill: #475569; font-size: 11px; }
      .accent { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <!-- Lanes -->
  <rect class="lane" x="20" y="20" width="940" height="120"/>
  <text class="lane-title" x="36" y="40">Offline lane — was the knowledge base prepared correctly?</text>

  <rect class="lane" x="20" y="160" width="940" height="120"/>
  <text class="lane-title" x="36" y="180">Online lane — was the right evidence found and used for this query?</text>

  <rect class="lane" x="20" y="300" width="940" height="120"/>
  <text class="lane-title" x="36" y="320">Post-generation — is the answer faithful and verifiable?</text>

  <!-- Offline boxes -->
  <g>
    <rect class="box" x="50" y="60" width="160" height="60"/>
    <text class="box-label" x="130" y="86" text-anchor="middle">scifact corpus</text>
    <text class="box-sub" x="130" y="104" text-anchor="middle">+ synthetic metadata</text>
  </g>
  <g>
    <rect class="box" x="240" y="60" width="160" height="60"/>
    <text class="box-label" x="320" y="86" text-anchor="middle">chunking</text>
    <text class="box-sub" x="320" y="104" text-anchor="middle">recursive / structural</text>
  </g>
  <g>
    <rect class="box" x="430" y="60" width="160" height="60"/>
    <text class="box-label" x="510" y="86" text-anchor="middle">embed</text>
    <text class="box-sub" x="510" y="104" text-anchor="middle">bge-small + BM25</text>
  </g>
  <g>
    <rect class="box" x="620" y="60" width="160" height="60"/>
    <text class="box-label" x="700" y="86" text-anchor="middle">Qdrant</text>
    <text class="box-sub" x="700" y="104" text-anchor="middle">named dense + sparse</text>
  </g>
  <g>
    <rect class="box" x="810" y="60" width="130" height="60"/>
    <text class="box-label" x="875" y="86" text-anchor="middle">golden sets</text>
    <text class="box-sub" x="875" y="104" text-anchor="middle">retrieval / filter / gen</text>
  </g>

  <!-- Online boxes -->
  <g>
    <rect class="box" x="50" y="200" width="140" height="60"/>
    <text class="box-label" x="120" y="226" text-anchor="middle">query</text>
    <text class="box-sub" x="120" y="244" text-anchor="middle">scifact test set</text>
  </g>
  <g>
    <rect class="box" x="220" y="200" width="160" height="60"/>
    <text class="box-label" x="300" y="226" text-anchor="middle">dense + sparse</text>
    <text class="box-sub" x="300" y="244" text-anchor="middle">two Qdrant queries</text>
  </g>
  <g>
    <rect class="box" x="410" y="200" width="160" height="60"/>
    <text class="box-label" x="490" y="226" text-anchor="middle">RRF fuse</text>
    <text class="box-sub" x="490" y="244" text-anchor="middle">k = 60</text>
  </g>
  <g>
    <rect class="box" x="600" y="200" width="160" height="60"/>
    <text class="box-label" x="680" y="226" text-anchor="middle">rerank</text>
    <text class="box-sub" x="680" y="244" text-anchor="middle">bge-reranker-v2-m3</text>
  </g>
  <g>
    <rect class="box" x="790" y="200" width="150" height="60"/>
    <text class="box-label" x="865" y="226" text-anchor="middle">generate</text>
    <text class="box-sub" x="865" y="244" text-anchor="middle">LiteLLM (gpt-5-mini …)</text>
  </g>

  <!-- Post-gen boxes -->
  <g>
    <rect class="box" x="50" y="340" width="160" height="60"/>
    <text class="box-label" x="130" y="366" text-anchor="middle">retrieval metrics</text>
    <text class="box-sub" x="130" y="384" text-anchor="middle">Recall@k, MRR, nDCG</text>
  </g>
  <g>
    <rect class="box accent" x="240" y="340" width="180" height="60"/>
    <text class="box-label" x="330" y="366" text-anchor="middle">filter false-exclusion</text>
    <text class="box-sub" x="330" y="384" text-anchor="middle">silent-failure detector</text>
  </g>
  <g>
    <rect class="box" x="450" y="340" width="160" height="60"/>
    <text class="box-label" x="530" y="366" text-anchor="middle">faithfulness</text>
    <text class="box-sub" x="530" y="384" text-anchor="middle">claims + verify</text>
  </g>
  <g>
    <rect class="box" x="640" y="340" width="160" height="60"/>
    <text class="box-label" x="720" y="366" text-anchor="middle">LLM-as-judge</text>
    <text class="box-sub" x="720" y="384" text-anchor="middle">cross-family, debiased</text>
  </g>
  <g>
    <rect class="box" x="820" y="340" width="120" height="60"/>
    <text class="box-label" x="880" y="366" text-anchor="middle">latency</text>
    <text class="box-sub" x="880" y="384" text-anchor="middle">p50 / p95 / p99</text>
  </g>

  <!-- Arrows: offline -->
  <path class="arrow" d="M210 90 L240 90" marker-end="url(#a)"/>
  <path class="arrow" d="M400 90 L430 90" marker-end="url(#a)"/>
  <path class="arrow" d="M590 90 L620 90" marker-end="url(#a)"/>
  <path class="arrow" d="M780 90 L810 90" marker-end="url(#a)"/>

  <!-- Arrows: online -->
  <path class="arrow" d="M190 230 L220 230" marker-end="url(#a)"/>
  <path class="arrow" d="M380 230 L410 230" marker-end="url(#a)"/>
  <path class="arrow" d="M570 230 L600 230" marker-end="url(#a)"/>
  <path class="arrow" d="M760 230 L790 230" marker-end="url(#a)"/>

  <!-- Cross-lane: index -> retrieve -->
  <path class="arrow" d="M700 120 L700 160 L300 160 L300 200" marker-end="url(#a)"/>
  <!-- Cross-lane: generate -> evaluate -->
  <path class="arrow" d="M865 260 L865 300 L720 300 L720 340" marker-end="url(#a)"/>
  <!-- Cross-lane: retrieve -> filter exclusion -->
  <path class="arrow" d="M300 260 L300 300 L330 300 L330 340" marker-end="url(#a)"/>
</svg>

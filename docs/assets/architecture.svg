<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .lane-off  { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .lane-on   { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .lane-eval { fill: #fffbeb; stroke: #fde68a; stroke-width: 1; }
      .lane-title { font-weight: 600; fill: #0f172a; font-size: 13px; }
      .lane-q { fill: #475569; font-size: 11px; font-style: italic; }
      .box { fill: #fff; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .lbl { fill: #0f172a; font-weight: 500; }
      .sub { fill: #475569; font-size: 11px; }
      .accent { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 1.4; fill: none; }
      .cross { stroke: #64748b; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- Lanes -->
  <rect class="lane-off"  x="20" y="20"  width="940" height="130"/>
  <text class="lane-title" x="36" y="42">Offline</text>
  <text class="lane-q"     x="80" y="42">was the knowledge base prepared correctly?</text>

  <rect class="lane-on"   x="20" y="170" width="940" height="130"/>
  <text class="lane-title" x="36" y="192">Online</text>
  <text class="lane-q"     x="78" y="192">did we find and use the right evidence for this query?</text>

  <rect class="lane-eval" x="20" y="320" width="940" height="140"/>
  <text class="lane-title" x="36" y="342">Post-generation</text>
  <text class="lane-q"     x="135" y="342">is the answer faithful and verifiable?</text>

  <!-- Offline boxes -->
  <g>
    <rect class="box" x="50" y="60" width="160" height="64"/>
    <text class="lbl" x="130" y="86" text-anchor="middle">scifact corpus</text>
    <text class="sub" x="130" y="106" text-anchor="middle">+ synthetic metadata</text>
  </g>
  <g>
    <rect class="box" x="240" y="60" width="160" height="64"/>
    <text class="lbl" x="320" y="86" text-anchor="middle">chunking</text>
    <text class="sub" x="320" y="106" text-anchor="middle">recursive / structural</text>
  </g>
  <g>
    <rect class="box" x="430" y="60" width="160" height="64"/>
    <text class="lbl" x="510" y="86" text-anchor="middle">embed</text>
    <text class="sub" x="510" y="106" text-anchor="middle">bge-small + BM25</text>
  </g>
  <g>
    <rect class="box" x="620" y="60" width="160" height="64"/>
    <text class="lbl" x="700" y="86" text-anchor="middle">Qdrant</text>
    <text class="sub" x="700" y="106" text-anchor="middle">named dense + sparse</text>
  </g>
  <g>
    <rect class="box" x="810" y="60" width="130" height="64"/>
    <text class="lbl" x="875" y="86" text-anchor="middle">golden sets</text>
    <text class="sub" x="875" y="106" text-anchor="middle">retrieval / filter / gen</text>
  </g>

  <!-- Online boxes -->
  <g>
    <rect class="box" x="50" y="210" width="140" height="64"/>
    <text class="lbl" x="120" y="236" text-anchor="middle">query</text>
    <text class="sub" x="120" y="256" text-anchor="middle">scifact test set</text>
  </g>
  <g>
    <rect class="box" x="220" y="210" width="160" height="64"/>
    <text class="lbl" x="300" y="236" text-anchor="middle">dense + sparse</text>
    <text class="sub" x="300" y="256" text-anchor="middle">two Qdrant queries</text>
  </g>
  <g>
    <rect class="box" x="410" y="210" width="160" height="64"/>
    <text class="lbl" x="490" y="236" text-anchor="middle">RRF fuse</text>
    <text class="sub" x="490" y="256" text-anchor="middle">k = 60</text>
  </g>
  <g>
    <rect class="box" x="600" y="210" width="160" height="64"/>
    <text class="lbl" x="680" y="236" text-anchor="middle">rerank</text>
    <text class="sub" x="680" y="256" text-anchor="middle">bge-reranker-v2-m3</text>
  </g>
  <g>
    <rect class="box" x="790" y="210" width="150" height="64"/>
    <text class="lbl" x="865" y="236" text-anchor="middle">generate</text>
    <text class="sub" x="865" y="256" text-anchor="middle">OpenAI (GPT-5.6 Luna)</text>
  </g>

  <!-- Post-gen boxes -->
  <g>
    <rect class="box" x="50" y="370" width="160" height="64"/>
    <text class="lbl" x="130" y="396" text-anchor="middle">retrieval metrics</text>
    <text class="sub" x="130" y="416" text-anchor="middle">Recall@k, MRR, nDCG</text>
  </g>
  <g>
    <rect class="box accent" x="240" y="370" width="180" height="64"/>
    <text class="lbl" x="330" y="396" text-anchor="middle">filter false-exclusion</text>
    <text class="sub" x="330" y="416" text-anchor="middle">silent-failure detector</text>
  </g>
  <g>
    <rect class="box" x="450" y="370" width="160" height="64"/>
    <text class="lbl" x="530" y="396" text-anchor="middle">faithfulness</text>
    <text class="sub" x="530" y="416" text-anchor="middle">claims + verify</text>
  </g>
  <g>
    <rect class="box" x="640" y="370" width="160" height="64"/>
    <text class="lbl" x="720" y="396" text-anchor="middle">LLM-as-judge</text>
    <text class="sub" x="720" y="416" text-anchor="middle">SGR, mirrored order</text>
  </g>
  <g>
    <rect class="box" x="820" y="370" width="120" height="64"/>
    <text class="lbl" x="880" y="396" text-anchor="middle">latency</text>
    <text class="sub" x="880" y="416" text-anchor="middle">p50 / p95 / p99</text>
  </g>

  <!-- Arrows: offline -->
  <path class="arrow" d="M210 92 L240 92" marker-end="url(#a)"/>
  <path class="arrow" d="M400 92 L430 92" marker-end="url(#a)"/>
  <path class="arrow" d="M590 92 L620 92" marker-end="url(#a)"/>
  <path class="arrow" d="M780 92 L810 92" marker-end="url(#a)"/>

  <!-- Arrows: online -->
  <path class="arrow" d="M190 242 L220 242" marker-end="url(#a)"/>
  <path class="arrow" d="M380 242 L410 242" marker-end="url(#a)"/>
  <path class="arrow" d="M570 242 L600 242" marker-end="url(#a)"/>
  <path class="arrow" d="M760 242 L790 242" marker-end="url(#a)"/>

  <!-- Cross-lane: index -> retrieve -->
  <path class="cross" d="M700 124 L700 170 L300 170 L300 210" marker-end="url(#a)"/>
  <!-- Cross-lane: generate -> evaluate -->
  <path class="cross" d="M865 274 L865 320 L720 320 L720 370" marker-end="url(#a)"/>
  <!-- Cross-lane: retrieve -> filter exclusion -->
  <path class="cross" d="M300 274 L300 320 L330 320 L330 370" marker-end="url(#a)"/>
</svg>
